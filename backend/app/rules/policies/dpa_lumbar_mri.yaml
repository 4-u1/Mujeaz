# Demo Payer A — Lumbar Spine MRI prior-authorization policy (DEMO, fictional).
# Source text and rules are versioned together; every evaluation records `version`.
policy: DPA-LUMBAR-POL
version: "2026.1"
payer: DPA
service_codes: ["72148"]
decision:
  ready_min: 90            # readiness needed for DECISION_READY (and no failed mandatory rule)
addenda:
  accepts_post_request: true   # structured physician addenda written after the request count as evidence
title: Lumbar Spine MRI Prior Authorization (demo)
title_ar: سياسة الموافقة المسبقة للرنين المغناطيسي القطني (تجريبية)
source_text: |
  Demo Payer A — Lumbar Spine MRI Prior Authorization Policy (DEMO, fictional)
  1. Conservative therapy: at least six (6) weeks of documented conservative management
     (physiotherapy and/or NSAIDs) before lumbar MRI.
  2. Exemption: red-flag findings (e.g. cauda equina signs, progressive neurological deficit)
     waive requirement 1.
  3. Coding: the diagnosis must be clinically compatible with lumbar spine imaging.

requirements:
  R1_conservative_therapy_6w:
    title: Proof of at least 6 weeks of conservative therapy
    title_ar: إثبات 6 أسابيع على الأقل من العلاج التحفظي
    fact_label: conservative_therapy
    satisfied_if: {min_weeks: 6}
    contradicted_by: [therapy_not_attended]
    supporting_labels: [medication, persistent_symptoms]
    query:
      en: physiotherapy physical therapy physio sessions visits weeks completed NSAID naproxen ibuprofen
      ar: علاج طبيعي فيزيائي جلسات أسابيع حضر أكمل مسكنات مضاد التهاب
    cdi:
      en: >-
        Did the patient complete at least 6 weeks of conservative therapy (physiotherapy and/or NSAIDs)
        before this request? If yes, please document the start and end dates and the number of sessions.
      ar: >-
        هل أكمل المريض 6 أسابيع على الأقل من العلاج التحفظي (علاج طبيعي و/أو مضادات التهاب) قبل هذا الطلب؟
        إذا نعم، يرجى توثيق تاريخي البداية والنهاية وعدد الجلسات.

rules:
  - code: DPA-LUMBAR-POL-04
    id: R1_conservative_therapy_6w
    title: 6-Week Conservative Therapy Requirement
    title_ar: شرط العلاج التحفظي لمدة 6 أسابيع على الأقل
    requirement: >-
      Proof of at least 6 weeks of non-surgical management (Physiotherapy/NSAIDs) prior to Lumbar MRI
      unless red flags exist.
    requirement_ar: >-
      إثبات 6 أسابيع على الأقل من العلاج التحفظي (علاج طبيعي / مسكنات) قبل طلب الرنين المغناطيسي
      ما لم توجد مؤشرات خطيرة.
    mandatory: true
    predicate: evidence_status
    requirement_id: R1_conservative_therapy_6w
    exempt_if_any_fact: [red_flag]
    outcomes: {FOUND: PASSED, PARTIAL: WARNING, MISSING: FAILED}
  - code: DPA-CODING-01
    id: R2_diagnosis_procedure_compatibility
    title: Diagnosis–Procedure Compatibility
    title_ar: توافق التشخيص مع الإجراء
    requirement: The diagnosis must be compatible with lumbar spine MRI.
    requirement_ar: يجب أن يكون التشخيص متوافقًا مع الرنين المغناطيسي للفقرات القطنية.
    mandatory: true
    predicate: diagnosis_prefix_in
    prefixes: [M51, M54, M48, M47, M43, M53, G83.4]
