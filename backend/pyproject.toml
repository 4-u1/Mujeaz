[project]
name = "mujeaz-backend"
version = "0.4.0"
description = "Mujeaz API — prior-authorization readiness and revenue assurance"
authors = [{ name = "Yazeed Hamad Alharthi" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pyjwt[crypto]>=2.9,<3",
  "cryptography>=43",
  "google-genai>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["seed/*.json", "prompts/*.md", "rules/policies/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "S608", "E501"]  # E501: `ruff format` owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["S603", "S607"]
"../evals/**" = ["S311"]  # deterministic synthetic data, not cryptography

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.scoring.*", "app.audit.canonical", "app.security.rbac", "app.cases.state_machine"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a PostgreSQL database (MUJEAZ_TEST_DATABASE_URL)"]
